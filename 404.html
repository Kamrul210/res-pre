<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | The Verdant</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231B4332'/><text y='.9em' font-size='75' x='12'>🌿</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Jost',sans-serif;background:#0D1B12;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .wrap{max-width:560px;}
  .num{font-family:'Cormorant Garamond',serif;font-size:clamp(100px,20vw,180px);font-weight:700;color:#1B4332;line-height:1;text-shadow:0 0 80px rgba(201,168,76,0.15);}
  .num span{color:#C9A84C;font-style:italic;}
  .emoji{font-size:52px;margin:8px 0 20px;}
  h1{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,4vw,36px);color:white;font-weight:700;margin-bottom:12px;letter-spacing:0.02em;}
  p{font-size:14px;color:rgba(255,255,255,0.5);line-height:1.8;margin-bottom:36px;}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn-home{display:inline-flex;align-items:center;gap:9px;background:#C9A84C;color:#0D1B12;padding:14px 32px;font-size:12px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;text-decoration:none;border-radius:6px;transition:all .3s;}
  .btn-home:hover{background:#E8C97A;transform:translateY(-2px);}
  .btn-menu{display:inline-flex;align-items:center;gap:9px;background:transparent;color:rgba(255,255,255,0.6);padding:14px 28px;font-size:12px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;text-decoration:none;border-radius:6px;border:1px solid rgba(255,255,255,0.15);transition:all .3s;}
  .btn-menu:hover{border-color:#C9A84C;color:#C9A84C;}
  .divider{width:1px;height:40px;background:rgba(201,168,76,0.3);margin:0 auto 28px;}
  .brand{font-family:'Cormorant Garamond',serif;font-size:18px;color:rgba(255,255,255,0.3);letter-spacing:0.08em;margin-bottom:32px;}
  .brand span{color:rgba(201,168,76,0.6);font-style:italic;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">The <span>Verdant</span></div>
  <div class="num">4<span>0</span>4</div>
  <div class="emoji">🍽️</div>
  <h1>This Table Doesn't Exist</h1>
  <p>The page you're looking for has left the building — or perhaps was never on our menu. Let us guide you back to something delicious.</p>
  <div class="divider"></div>
  <div class="actions">
    <a href="index.html" class="btn-home"><i class="fas fa-home"></i> Back to Home</a>
    <a href="index.html#categories" class="btn-menu"><i class="fas fa-utensils"></i> View Menu</a>
  </div>
</div>
</body>
</html>
